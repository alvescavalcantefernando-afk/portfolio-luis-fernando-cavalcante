  <main>
    <!-- Pagina Contato -->
    <section>
      <h2>Contato</h2>
      <p>Para falar comigo, preencha o formulário abaixo.</p>

      <!-- novalidate desliga a validacao do navegador, quem valida e o JavaScript -->
      <form id="formContato" novalidate>
        <label for="nome">Nome</label>
        <input type="text" id="nome">
        <span class="erro" id="erroNome"></span>

        <label for="email">E-mail</label>
        <input type="email" id="email">
        <span class="erro" id="erroEmail"></span>

        <label for="mensagem">Mensagem</label>
        <textarea id="mensagem"></textarea>
        <span class="erro" id="erroMensagem"></span>

        <br>
        <button type="submit">Enviar</button>
      </form>
    </section>

    <section>
      <h2>Redes</h2>
      <p><a href="https://github.com/alvescavalcantefernando-afk" target="_blank">GitHub</a></p>
    </section>
  </main>
